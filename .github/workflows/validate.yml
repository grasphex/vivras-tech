name: Validate VIVRAS Tech
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check inline glossary JavaScript
        run: node --check assets/terms.js
      - name: Test term popup interactions
        run: node scripts/test_terms.cjs
      - name: Check mount simulator syntax
        run: node --check assets/mount-lab.js
      - name: Test mount command transitions
        run: node scripts/test_mount_lab.cjs
      - name: Build topic and article pages
        run: python3 scripts/build.py
      - name: Check metadata and local links
        run: python3 scripts/validate.py
      - name: Check technical article explanation flow
        run: python3 scripts/validate_tech_lessons.py
