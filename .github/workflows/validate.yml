name: Validate VIVRAS Tech
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate glossary interaction JavaScript
        run: node --check assets/terms.js
      - name: Build topic and article pages
        run: python3 scripts/build.py
      - name: Check metadata and local links
        run: python3 scripts/validate.py
